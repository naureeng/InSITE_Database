<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/colreorder/1.7.0/css/colReorder.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/colreorder/1.7.0/js/dataTables.colReorder.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body {
      margin: 30px;
      font-family: Arial, Helvetica, sans-serif;
    }
    th, td {
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>
<body>

<table id="stock-table" class="display responsive no-wrap" cellspacing="0" width="100%">
  <thead>
    <tr>
      <th>Stock ID</th>
      <th>Genotype</th>
      <th>Bloomington Number</th>
      <th>Full Genotype</th>
      <th>Inserted Into</th>
      <th>5 Prime</th>
      <th>3 Prime</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  Papa.parse("InSITE_DB_stocks_CSV.csv", {
    download: true,
    header: true,
    skipEmptyLines: true,
    delimiter: ",",
    complete: function (results) {
      var tableData = results.data.map(function (row) {
        var bloomington = (row["Bloomington Number"] || "").trim();
        var bloomingtonCell = bloomington
          ? '<a href="http://flybase.org/reports/FBst00' + bloomington + '.html" target="_blank">' + bloomington + '</a>'
          : "";

        return [
          (row["Stock ID"]        || "").trim(),
          (row["Genotype"]        || "").trim(),
          bloomingtonCell,
          (row["Full Genotype"]   || "").trim(),
          (row["Inserted into"]   || "").trim(),
          (row["5 prime"]         || "").trim(),
          (row["3 prime"]         || "").trim()
        ];
      });

      $("#stock-table").DataTable({
        data: tableData,
        colReorder: true,
        responsive: true,
        columnDefs: [
          { targets: [2], orderable: false }  // don't sort the link column
        ]
      });
    },
    error: function () {
      document.querySelector("#stock-table tbody").innerHTML =
        "<tr><td colspan='7'>Could not load InSITE_DB_stocks_CSV.csv.</td></tr>";
    }
  });
</script>

</body>
</html>
