<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox-plus-jquery.min.js"></script>
  <style>
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .gallery a {
      border: none !important;
      text-decoration: none !important;
    }
    .gallery img {
      width: 180px !important;
      height: auto !important;
      border: none !important;
      padding: 0 !important;
      box-shadow: none !important;
      display: block;
    }
    /* Lightbox caption styling */
    .lb-data .lb-caption {
      font-family: Helvetica, Arial, sans-serif !important;
      font-size: 20px !important;
      font-weight: 500;
      line-height: 1.4;
    }
    #gallery-error {
      color: #c0392b;
      font-family: Helvetica, Arial, sans-serif;
      padding: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="gallery" id="gallery"></div>
  <p id="gallery-error">Could not load gallery images. Make sure <code>adultvnc/manifest.json</code> exists.</p>

  <script>
    /**
     * adultvnc.html
     *
     * Replaces adultvnc.php for Columbia CUIT static hosting.
     * Reads adultvnc/manifest.json — a pre-built list of image filenames —
     * then renders the Lightbox2 gallery dynamically.
     *
     * To regenerate manifest.json after adding/removing images, run:
     *   python generate_manifest.py
     */
    (function () {
      var GALLERY_ID   = "adultvnc";          // folder name & lightbox group name
      var THUMB_PREFIX = GALLERY_ID + "/_thumb/";
      var FULL_PREFIX  = GALLERY_ID + "/";

      fetch(GALLERY_ID + "/manifest.json")
        .then(function (res) {
          if (!res.ok) throw new Error("manifest not found");
          return res.json();
        })
        .then(function (images) {
          var container = document.getElementById("gallery");
          images.forEach(function (filename) {
            var name  = filename.replace(/\.[^.]+$/, "");  // strip extension
            var thumb = THUMB_PREFIX + filename;
            var full  = FULL_PREFIX  + filename;

            var a   = document.createElement("a");
            a.href             = full;
            a.setAttribute("data-lightbox", GALLERY_ID);
            a.setAttribute("data-title",    name);

            var img = document.createElement("img");
            img.src = thumb;
            img.alt = name;

            a.appendChild(img);
            container.appendChild(a);
          });
        })
        .catch(function () {
          document.getElementById("gallery-error").style.display = "block";
        });
    })();
  </script>
</body>
</html>
